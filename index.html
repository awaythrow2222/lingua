<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lingua — Spanish, French, Tagalog & English</title>
  <meta name="description" content="Grammar-focused language practice with flashcards, daily reading and listening, and an AI tutor.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗣️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand"><span class="brand-mark">L</span> Lingua</a>
    <div class="lang-switch" id="langSwitch" role="tablist" aria-label="Language"></div>
    <button class="icon-btn" id="menuBtn" aria-label="Menu" aria-expanded="false">☰</button>
  </header>

  <div class="layout">
    <nav class="sidenav" id="sidenav" aria-label="Main">
      <a href="#/" data-route="home"><span>🏠</span> Today</a>
      <a href="#/grammar" data-route="grammar"><span>📘</span> Grammar</a>
      <a href="#/flashcards" data-route="flashcards"><span>🃏</span> Flashcards</a>
      <a href="#/reading" data-route="reading"><span>📖</span> Daily reading</a>
      <a href="#/words" data-route="words"><span>✨</span> Daily words</a>
      <a href="#/listening" data-route="listening"><span>🎧</span> Daily listening</a>
      <a href="#/progress" data-route="progress"><span>📈</span> Progress</a>
      <a href="#/settings" data-route="settings"><span>⚙️</span> Settings</a>
      <div class="level-box">
        <label for="levelSelect">Your level</label>
        <select id="levelSelect">
          <option value="beginner">Beginner</option>
          <option value="intermediate">Intermediate</option>
          <option value="advanced">Advanced</option>
        </select>
      </div>
    </nav>
    <main id="view" tabindex="-1"></main>
  </div>

  <!-- Word popup -->
  <div id="wordPopup" class="word-popup" role="dialog" aria-modal="false" aria-labelledby="wpWord" hidden></div>

  <!-- AI tutor -->
  <button id="tutorFab" class="tutor-fab" aria-label="Open AI tutor" aria-controls="tutorPanel">💬 <span>Ask tutor</span></button>
  <aside id="tutorPanel" class="tutor-panel" aria-label="AI tutor" hidden>
    <div class="tutor-head">
      <div>
        <strong>AI tutor</strong>
        <div class="muted small" id="tutorCtx"></div>
      </div>
      <div>
        <button class="icon-btn" id="tutorClear" title="New conversation" aria-label="New conversation">↺</button>
        <button class="icon-btn" id="tutorClose" aria-label="Close tutor">✕</button>
      </div>
    </div>
    <div class="tutor-msgs" id="tutorMsgs" aria-live="polite"></div>
    <form class="tutor-form" id="tutorForm">
      <textarea id="tutorInput" rows="2" placeholder="Ask anything — grammar, a word, a sentence to check…"></textarea>
      <button class="btn primary" type="submit">Send</button>
    </form>
  </aside>

  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
